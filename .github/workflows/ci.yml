name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fl
          POSTGRES_PASSWORD: fl
          POSTGRES_DB: football_legacy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fl:fl@localhost:5432/football_legacy_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:lines
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @fl/web build

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline – Football Legacy</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11151c; color: #e8ecf2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 420px; text-align: center; background: #181d26; border: 1px solid #262d39; border-radius: 6px; padding: 28px 24px; }
  img { width: 64px; height: 64px; border-radius: 14px; }
  h1 { font-size: 22px; margin: 16px 0 8px; letter-spacing: .02em; text-transform: uppercase; }
  p { color: #a3adbd; line-height: 1.5; margin: 0 0 18px; }
  button { font: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: #3d8bfd; color: #fff; border: 0; border-radius: 4px; padding: 10px 18px; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Keine Verbindung</h1>
    <p>Football Legacy braucht eine Internetverbindung – dein Spielstand liegt sicher auf dem Server. Sobald du wieder online bist, geht es weiter.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
